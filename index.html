<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrito de Compras</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="assets/icono.png" />
</head>

<body >
  <div id="carrito" class="max-w-7xl mx-auto p-4">
    <header class="flex justify-between items-center mb-6 border-b pb-4">
      <h1 class="text-2xl font-bold text-gray-800">Carrito de compras Vue</h1>

     
      <nav class="relative">
        <button @click="activo = !activo" class="hamburguesa text-2xl p-2 flex items-center gap-2">
          🛒 <span class="text-sm font-bold bg-blue-600 text-white px-2 py-0.5 rounded-full">{{ cantidadTotalProductos }}</span>
        </button>

        <!-- Checkout sidebar -->
        <div 
          v-show="activo" 
          class="fixed inset-0 z-50 flex justify-end bg-black bg-opacity-40 transition-opacity"
          @click.self="activo = false"
        >
          <div class="bg-white w-full max-w-md h-full p-6 shadow-2xl">

            <!-- Componente carrito -->
            <carrito
              :carrito="carrito" 
              :cantidadp="cantidadTotalProductos"
              :totalc="totalCarrito" 
              @quitar="delItem" 
              @vaciar="delCar"
              @eliminar="delPro">
            </carrito>
          </div>
        </div>
      </nav>
    </header>

    <div>
      <h2 class="text-xl font-bold text-gray-700 mb-4">Productos</h2>

      <!-- Filtros -->
<div class="mb-6 max-w-xs relative">
  <select 
    v-model="categoria" 
    class="w-full bg-transparent py-2 pr-8 pl-1 border-b-2 border-pink-500 text-gray-700 font-medium appearance-none focus:outline-none focus:border-blue-600 cursor-pointer transition-colors"
  >
    <option value="">Todas</option>
    <option value="iphone">iPhone</option>
    <option value="samsung">Samsung</option>
    <option value="notebook">Notebooks</option>
    <option value="tablet">Tablets</option>
  </select>
  <!-- Flechita delgada alineada a la derecha -->
  <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-1 text-gray-500">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
    </svg>
  </div>
</div>

      <!-- componente de lista de productos -->
      <div class="productos-lista">
        <listaproductos @add="addItem" :item="filter"></listaproductos>
      </div>
    </div>

    
    <transition
      enter-active-class="transform ease-out duration-300 transition"
      enter-from-class="translate-y-2 opacity-0 sm:translate-y-0 sm:translate-x-2"
      enter-to-class="translate-y-0 opacity-100 sm:translate-x-0"
      leave-active-class="transition ease-in duration-100"
      leave-from-class="opacity-100"
      leave-to-class="opacity-0"
    >
      <div
        v-show="mostrarToast"
        class="fixed bottom-5 right-5 z-50 flex items-center gap-3 bg-emerald-50 border border-emerald-200 text-emerald-900 px-4 py-3 rounded-xl shadow-lg max-w-sm"
        role="alert"
      >
        <div class="w-7 h-7 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center font-bold text-xs shrink-0">
          ✓
        </div>
        <div class="text-xs font-medium pr-2">
          <span class="font-bold text-emerald-950">{{ productoAgregado }}</span> se añadió al carrito.
        </div>
        <button
          @click="mostrarToast = false"
          type="button"
          class="text-emerald-500 hover:text-emerald-700 p-1 rounded-lg transition ml-auto"
        >
          ✕
        </button>
      </div>
    </transition>

  </div> 

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="componentes/Card.js"></script>
  <script src="componentes/Listaproductos.js"></script>
  <script src="componentes/Carrito.js"></script>
  <script src="componentes/TotalCantidad.js"></script>
  <script src="componentes/TotalPrecio.js"></script>
  <script src="carrito.js"></script>
</body>
</html>
